<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#262626">
  <title>Fireplace — preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #252525; }
    .frame { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
    .skin { position: relative; width: 1672px; height: 975px; flex: none; transform-origin: center; }
    iframe { position: absolute; display: block; border: 0; background: transparent; }
    .left { left: 0; top: 0; width: 320px; height: 975px; }
    .top { left: 320px; top: 0; width: 1032px; height: 250px; }
    .website { position: absolute; left: 320px; top: 250px; width: 1032px; height: 725px; background: linear-gradient(135deg, #303030, #222); }
    .right { left: 1352px; top: 0; width: 320px; height: 975px; }
    .debug { position: absolute; z-index: 10; inset: 0; border: 1px solid rgb(255 255 255 / 28%); pointer-events: none; }
  </style>
</head>
<body>
  <main class="frame">
    <div class="skin" id="skin">
      <iframe class="left" title="Left skyscraper" src="left.html?sync=1"></iframe>
      <iframe class="top" title="Top banner" src="top.html?sync=1"></iframe>
      <div class="website" aria-label="Publisher website placeholder"></div>
      <iframe class="right" title="Right skyscraper" src="right.html?sync=1"></iframe>
      <div class="debug" hidden></div>
    </div>
  </main>
  <script>
    (() => {
      const skin = document.getElementById("skin");
      const frames = Array.from(document.querySelectorAll("iframe"));
      const ready = new Set();
      const debug = new URLSearchParams(location.search).has("debug");
      if (debug) document.querySelector(".debug").hidden = false;

      function fit() {
        const scale = Math.min(window.innerWidth / 1672, window.innerHeight / 975);
        skin.style.transform = `scale(${scale})`;
      }
      function startFrames() {
        const message = { type: "fireplace-start", at: Date.now() + 350 };
        frames.forEach((frame) => frame.contentWindow.postMessage(message, location.origin));
      }

      window.addEventListener("resize", fit, { passive: true });
      window.addEventListener("message", (event) => {
        if (event.origin !== location.origin || !frames.some((frame) => frame.contentWindow === event.source)) return;
        if (event.data?.type !== "fireplace-ready") return;
        ready.add(event.source);
        if (ready.size === frames.length) startFrames();
      });
      fit();
    })();
  </script>
</body>
</html>
